name: Reusable Flutter CI

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          JSON array of runner labels, as chosen by the caller's `pick-runner`
          probe. Callers that route through the probe pass its output so the job
          falls back to the org self-hosted Fedora runner when hosted Actions
          are unavailable. Defaults to hosted-only for callers that do not.
        type: string
        default: '["ubuntu-latest"]'
      working-directory:
        type: string
        default: .
      flutter-version:
        type: string
        default: ""
      flutter-channel:
        type: string
        default: stable
      run-codegen:
        type: boolean
        default: false
      analyze-args:
        type: string
        default: --no-fatal-infos
      build-debug-apk:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality:
    name: Flutter quality gate
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Self-hosted fallback hygiene. Both steps no-op on GitHub-hosted runners.
      - name: Check required tools
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: |
          missing=()
          for bin in git curl tar unzip xz; do
            command -v "$bin" >/dev/null || missing+=("$bin")
          done
          if ((${#missing[@]})); then
            echo "On Fedora: sudo dnf install -y ${missing[*]}"
            exit 1
          fi

      - name: Clean leftover workspace
        if: runner.environment == 'self-hosted'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "${{ github.workspace }}"
          find "${{ github.workspace }}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@v5
      - name: Set up pinned Flutter
        if: inputs.flutter-version != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: ${{ inputs.flutter-channel }}
          cache: true
      - name: Set up Flutter channel
        if: inputs.flutter-version == ''
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter-channel }}
          cache: true
      - run: flutter pub get
      - name: Generate source
        if: inputs.run-codegen
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        env:
          ANALYZE_ARGS: ${{ inputs.analyze-args }}
        run: |
          # shellcheck disable=SC2153
          read -r -a analyze_args <<< "$ANALYZE_ARGS"
          flutter analyze "${analyze_args[@]}"
      - name: Test
        run: flutter test
      - name: Build debug APK
        if: inputs.build-debug-apk
        run: flutter build apk --debug
