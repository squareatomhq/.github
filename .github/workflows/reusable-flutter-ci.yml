name: Reusable Flutter CI

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      flutter-version:
        type: string
        default: stable
      run-codegen:
        type: boolean
        default: false
      analyze-args:
        type: string
        default: --no-fatal-infos
      build-debug-apk:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality:
    name: Flutter quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate source
        if: inputs.run-codegen
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        env:
          ANALYZE_ARGS: ${{ inputs.analyze-args }}
        run: |
          read -r -a analyze_args <<< "$ANALYZE_ARGS"
          flutter analyze "${analyze_args[@]}"
      - name: Test
        run: flutter test
      - name: Build debug APK
        if: inputs.build-debug-apk
        run: flutter build apk --debug
