name: Reusable Discord Notification

on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
      color:
        type: string
        default: "5865F2"
      icon-url:
        type: string
        default: ""
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  notify:
    name: Send repository activity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/github-script@v8
        if: env.WEBHOOK_URL != ''
        env:
          APP_NAME: ${{ inputs.app-name }}
          COLOR_HEX: ${{ inputs.color }}
          ICON_URL: ${{ inputs.icon-url }}
        with:
          script: |
            const event = context.eventName;
            const actor = context.actor;
            const repo = context.repo.owner + '/' + context.repo.repo;
            const sha = context.sha?.slice(0, 7) || 'n/a';
            const color = Number.parseInt(process.env.COLOR_HEX, 16) || 5793266;
            const payload = {
              username: 'Square Atom GitHub',
              embeds: [{
                title: process.env.APP_NAME + ' · ' + event,
                url: `https://github.com/${repo}/actions/runs/${context.runId}`,
                description: `**Repository:** ${repo}\n**Actor:** ${actor}\n**Ref:** ${context.ref || 'n/a'}\n**Commit:** ${sha}`,
                color,
                timestamp: new Date().toISOString(),
                thumbnail: process.env.ICON_URL ? { url: process.env.ICON_URL } : undefined
              }]
            };
            const response = await fetch(process.env.WEBHOOK_URL, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (!response.ok) core.setFailed(`Discord returned ${response.status}`);
