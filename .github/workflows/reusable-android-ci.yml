name: Reusable Android CI

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      java-version:
        type: string
        default: "17"
      test-task:
        type: string
        default: test
      lint-task:
        type: string
        default: lintDebug
      assemble-task:
        type: string
        default: :app:assembleDebug
      run-lint:
        type: boolean
        default: true
      artifact-path:
        type: string
        default: app/build/outputs/apk/debug/*.apk
      upload-artifact:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Android quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests
        env:
          GRADLE_TASK: ${{ inputs.test-task }}
        run: ./gradlew --no-daemon --stacktrace "$GRADLE_TASK"
      - name: Android lint
        if: inputs.run-lint
        env:
          GRADLE_TASK: ${{ inputs.lint-task }}
        run: ./gradlew --no-daemon --stacktrace "$GRADLE_TASK"
      - name: Assemble debug APK
        env:
          GRADLE_TASK: ${{ inputs.assemble-task }}
        run: ./gradlew --no-daemon --stacktrace "$GRADLE_TASK"
      - name: Upload debug APK
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.run_number }}
          path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7
