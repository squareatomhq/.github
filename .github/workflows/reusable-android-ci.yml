name: Reusable Android CI

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          JSON array of runner labels, as chosen by the caller's `pick-runner`
          probe. Callers that route through the probe pass its output so the job
          falls back to the org self-hosted Fedora runner when hosted Actions
          are unavailable. Defaults to hosted-only for callers that do not.
        type: string
        default: '["ubuntu-latest"]'
      working-directory:
        type: string
        default: .
      java-version:
        type: string
        default: "17"
      test-task:
        type: string
        default: test
      lint-task:
        type: string
        default: lintDebug
      assemble-task:
        type: string
        default: :app:assembleDebug
      run-lint:
        type: boolean
        default: true
      artifact-path:
        type: string
        default: app/build/outputs/apk/debug/*.apk
      upload-artifact:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Android quality gate
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Self-hosted fallback hygiene. Both steps no-op on GitHub-hosted runners.
      - name: Check required tools
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: |
          missing=()
          for bin in git curl tar unzip xz; do
            command -v "$bin" >/dev/null || missing+=("$bin")
          done
          if ((${#missing[@]})); then
            echo "On Fedora: sudo dnf install -y ${missing[*]}"
            exit 1
          fi

      - name: Clean leftover workspace
        if: runner.environment == 'self-hosted'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "${{ github.workspace }}"
          find "${{ github.workspace }}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests
        env:
          GRADLE_TASK: ${{ inputs.test-task }}
        run: ./gradlew --no-daemon --stacktrace "$GRADLE_TASK"
      - name: Android lint
        if: inputs.run-lint
        env:
          GRADLE_TASK: ${{ inputs.lint-task }}
        run: ./gradlew --no-daemon --stacktrace "$GRADLE_TASK"
      - name: Assemble debug APK
        env:
          GRADLE_TASK: ${{ inputs.assemble-task }}
        run: ./gradlew --no-daemon --stacktrace "$GRADLE_TASK"
      - name: Upload debug APK
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.run_number }}
          path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7
