name: Reusable Android Release

on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
      working-directory:
        type: string
        default: .
      stack:
        type: string
        required: true
        description: expo, flutter, or gradle
      node-version:
        type: string
        default: "22"
      java-version:
        type: string
        default: "17"
      flutter-version:
        type: string
        default: stable
      install-command:
        type: string
        default: ""
      build-command:
        type: string
        required: true
      artifact-path:
        type: string
        required: true
      aab-path:
        type: string
        default: ""
      package-name:
        type: string
        default: ""
      release-tag:
        type: string
        default: android-latest
      publish-to-play:
        type: boolean
        default: false
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: android-release-${{ github.repository }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v5
        if: inputs.stack == 'expo'
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - uses: subosito/flutter-action@v2
        if: inputs.stack == 'flutter'
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
        if: inputs.stack == 'gradle' || inputs.stack == 'expo'
      - name: Validate stack
        env:
          STACK: ${{ inputs.stack }}
        run: |
          case "$STACK" in expo|flutter|gradle) ;; *) echo "::error::stack must be expo, flutter, or gradle"; exit 1;; esac
      - name: Prepare standardized signing material
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "::error::All signing secrets are required when KEYSTORE_BASE64 is set"; exit 1;
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          {
            echo "SQUAREATOM_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "SQUAREATOM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SQUAREATOM_KEY_ALIAS=$KEY_ALIAS"
            echo "SQUAREATOM_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Install dependencies
        if: inputs.install-command != ''
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$INSTALL_COMMAND"
      - name: Build release
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app-name }}-android-${{ github.run_number }}
          path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 14
      - name: Publish rolling GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release-tag }}
          name: ${{ inputs.app-name }} Android
          prerelease: true
          make_latest: false
          files: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}
      - name: Validate Play publishing inputs
        if: inputs.publish-to-play
        env:
          AAB_PATH: ${{ inputs.aab-path }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$AAB_PATH" && test -n "$PACKAGE_NAME" && test -n "$PLAY_JSON" || {
            echo "::error::aab-path, package-name, and PLAY_SERVICE_ACCOUNT_JSON are required"; exit 1;
          }
      - name: Upload to Google Play
        if: inputs.publish-to-play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package-name }}
          releaseFiles: ${{ inputs.working-directory }}/${{ inputs.aab-path }}
          track: internal
          status: completed
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
